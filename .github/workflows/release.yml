name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3

      # rcodesign ad-hoc signs the macOS binaries so Apple Silicon will run them
      # (unsigned arm64 Mach-O is killed on launch). No Apple account needed.
      - name: Install rcodesign
        run: cargo install apple-codesign

      - name: Build binaries
        run: |
          set -euo pipefail
          targets="x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos"
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in $targets; do
            echo "::group::build $target"
            nix develop --command zig build -Dtarget="$target" -Doptimize=ReleaseSafe
            stage="br-${version}-${target}"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp zig-out/bin/br "$stage/br"
            # Apple Silicon refuses to run an unsigned Mach-O; ad-hoc sign the
            # macOS binaries (rcodesign runs on Linux, no Apple account needed).
            case "$target" in
              *-macos)
                rcodesign sign "$stage/br" "$stage/br.signed"
                mv "$stage/br.signed" "$stage/br"
                chmod +x "$stage/br"
                ;;
            esac
            cp -R worker "$stage/worker"
            cp README.md LICENSE "$stage/"
            tar -czf "dist/${stage}.tar.gz" "$stage"
            echo "::endgroup::"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

          # Release body: a Markdown table linking each tarball with its SHA256.
          declare -A label=(
            [x86_64-linux-musl]="Linux · x86_64"
            [aarch64-linux-musl]="Linux · aarch64 (arm64)"
            [x86_64-macos]="macOS · x86_64 (Intel)"
            [aarch64-macos]="macOS · aarch64 (Apple Silicon)"
          )
          repo="${{ github.repository }}"
          tag="$GITHUB_REF_NAME"
          {
            echo "## Downloads"
            echo
            echo "Untar and run: the \`br\` binary finds its \`worker/\` beside itself. Requires [Bun](https://bun.sh) 1.4+ on \`PATH\`."
            echo
            echo "| Platform | SHA256 |"
            echo "| --- | --- |"
            for target in $targets; do
              file="br-${version}-${target}.tar.gz"
              sha=$(awk -v f="$file" '$2==f {print $1}' dist/SHA256SUMS)
              url="https://github.com/${repo}/releases/download/${tag}/${file}"
              echo "| [${label[$target]}](${url}) | \`${sha}\` |"
            done
            echo
            echo "> **macOS:** the binaries are ad-hoc signed but not notarized, so strip the download quarantine before first run:"
            echo "> \`\`\`"
            echo "> xattr -dr com.apple.quarantine br"
            echo "> \`\`\`"
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\` (Linux) or \`shasum -a 256 -c SHA256SUMS\` (macOS)."
          } > dist/notes.md

          ls -l dist
          echo "----- release notes -----"
          cat dist/notes.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: br-binaries
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: dist/notes.md
          generate_release_notes: true

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build binaries
        run: |
          set -euo pipefail
          targets="x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos"
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in $targets; do
            echo "::group::build $target"
            nix develop --command zig build -Dtarget="$target" -Doptimize=ReleaseSafe
            stage="br-${version}-${target}"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp zig-out/bin/br "$stage/br"
            # zig already ad-hoc signs the macOS binaries (linker-signed), so
            # Apple Silicon runs them; no extra signing step needed.

            # Bundle the matching Bun so the tarball is self-contained. br finds
            # it via <exe dir>/bun (see bunExe in src/runner.zig).
            case "$target" in
              x86_64-linux-musl)  bun_plat=bun-linux-x64-musl ;;
              aarch64-linux-musl) bun_plat=bun-linux-aarch64-musl ;;
              x86_64-macos)       bun_plat=bun-darwin-x64 ;;
              aarch64-macos)      bun_plat=bun-darwin-aarch64 ;;
            esac
            curl -fsSL -o bun.zip "https://github.com/oven-sh/bun/releases/latest/download/${bun_plat}.zip"
            unzip -qo bun.zip
            cp "${bun_plat}/bun" "$stage/bun"
            chmod +x "$stage/bun"
            rm -rf bun.zip "$bun_plat"

            cp -R worker "$stage/worker"
            cp README.md LICENSE "$stage/"
            curl -fsSL -o "$stage/LICENSE-bun.md" https://raw.githubusercontent.com/oven-sh/bun/main/LICENSE.md
            tar -czf "dist/${stage}.tar.gz" "$stage"
            echo "::endgroup::"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

          # Release body: a Markdown table linking each tarball with its SHA256.
          declare -A label=(
            [x86_64-linux-musl]="Linux · x86_64"
            [aarch64-linux-musl]="Linux · aarch64 (arm64)"
            [x86_64-macos]="macOS · x86_64 (Intel)"
            [aarch64-macos]="macOS · aarch64 (Apple Silicon)"
          )
          repo="${{ github.repository }}"
          tag="$GITHUB_REF_NAME"
          {
            echo "## Downloads"
            echo
            echo "Self-contained: each tarball bundles \`br\`, a matching [Bun](https://bun.sh), and the \`worker/\` scripts. Untar and run \`./br\` — no dependencies to install."
            echo
            echo "| Platform | SHA256 |"
            echo "| --- | --- |"
            for target in $targets; do
              file="br-${version}-${target}.tar.gz"
              sha=$(awk -v f="$file" '$2==f {print $1}' dist/SHA256SUMS)
              url="https://github.com/${repo}/releases/download/${tag}/${file}"
              echo "| [${label[$target]}](${url}) | \`${sha}\` |"
            done
            echo
            echo "> **macOS:** the binaries are ad-hoc signed but not notarized, so strip the download quarantine before first run:"
            echo "> \`\`\`"
            echo "> xattr -dr com.apple.quarantine br"
            echo "> \`\`\`"
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\` (Linux) or \`shasum -a 256 -c SHA256SUMS\` (macOS)."
          } > dist/notes.md

          ls -l dist
          echo "----- release notes -----"
          cat dist/notes.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: br-binaries
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: dist/notes.md
          generate_release_notes: true

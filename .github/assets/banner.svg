  <!-- tagline -->
  <text x="388" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#AEBACB">A browser CLI built for agents</text>
  <text x="388" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#5D6B7E">semantic snapshots · stable <tspan fill="#2DD4BF">@refs</tspan> · Bun WebView · Kitty graphics</text>
</svg>

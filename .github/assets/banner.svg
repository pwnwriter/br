<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="br — a browser CLI built for agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1420"/>
      <stop offset="1" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="tile" x1="200" y1="88" x2="200" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141C2A"/>
      <stop offset="1" stop-color="#0B0F17"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="398" rx="27" fill="none" stroke="#1B2636" stroke-width="2"/>

  <!-- faint @ watermark -->
  <text x="1170" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="360" font-weight="700" fill="#111A28" text-anchor="middle">@</text>

  <!-- app tile -->
  <g transform="translate(88,88)">
    <rect width="224" height="224" rx="52" fill="url(#tile)"/>
    <rect x="1" y="1" width="222" height="222" rx="51" fill="none" stroke="#243244" stroke-width="2"/>
    <g fill="#2A3647">
      <circle cx="60" cy="52" r="8"/>
      <circle cx="86" cy="52" r="8"/>
      <circle cx="112" cy="52" r="8"/>
    </g>
    <g transform="translate(40,72) scale(0.7)">
      <g fill="none" stroke="#E7ECF3" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
        <line x1="30" y1="20" x2="30" y2="100"/>
        <circle cx="60" cy="70" r="30"/>
        <line x1="120" y1="40" x2="120" y2="100"/>
        <path d="M120 54 Q121 40 141 40"/>
      </g>
      <rect x="165" y="42" width="28" height="58" rx="5" fill="#2DD4BF"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(384,96) scale(1.95)">
    <g fill="none" stroke="#E7ECF3" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <line x1="30" y1="20" x2="30" y2="100"/>
      <circle cx="60" cy="70" r="30"/>
      <line x1="120" y1="40" x2="120" y2="100"/>
      <path d="M120 54 Q121 40 141 40"/>
